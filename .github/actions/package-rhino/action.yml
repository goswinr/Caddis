name: Package for Rhino
description: Publish Caddis for every Rhino runtime into the folders of the Rhino 8 and Rhino 9 Yak packages.

# Used by build.yml and release-rhino.yml. Requires a checkout and the .NET 10 SDK, on Windows for net48.
# Two distributions of the same version, each a folder in bin/publish/rhino with manifest.yml, logo.png and LICENSE:
#   rh8/  net8.0/ and net48/, for Rhino 8
#   rh9/  net10.0/, for Rhino 9
# Within a package Rhino chooses the folder of the runtime it runs on: in Rhino 8 net8.0 on Windows and Mac, net48 on Windows with .NET Framework.
# The action build-yak builds the packages from these folders. release-rhino.yml signs the files before.
# https://developer.rhino3d.com/guides/yak/creating-a-multi-targeted-rhino-plugin-package/

outputs:
  version:
    description: Version of the latest release in CHANGELOG.md
    value: ${{ steps.version.outputs.version }}
  pack-dir:
    description: The folder with rh8 and rh9, relative to the repository root
    value: bin/publish/rhino

runs:
  using: composite
  steps:
    # One step per framework, so that a failure in one is not masked by another.
    # Rhino provides the runtime. Publish includes Caddis.Core and the F# dependencies.
    - name: Publish net8.0
      shell: pwsh
      run: >-
        dotnet publish Caddis.Rhino/Caddis.Rhino.fsproj
        --configuration Release --framework net8.0 --self-contained false
        --output bin/publish/rhino/rh8/net8.0

    - name: Publish net48
      # Rhino 8 on .NET Framework, the panel with Avalonia 11.
      shell: pwsh
      run: >-
        dotnet publish Caddis.Rhino/Caddis.Rhino.fsproj
        --configuration Release --framework net48
        --output bin/publish/rhino/rh8/net48

    - name: Publish net10.0
      # Rhino 9
      shell: pwsh
      run: >-
        dotnet publish Caddis.Rhino/Caddis.Rhino.fsproj
        --configuration Release --framework net10.0 --self-contained false
        --output bin/publish/rhino/rh9/net10.0

    - name: Copy package metadata
      # Each package folder gets its own manifest.yml outside of the framework folders.
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($rh in 'rh8', 'rh9') {
          Copy-Item -LiteralPath 'Caddis.Rhino/yak.yml' -Destination "bin/publish/rhino/$rh/manifest.yml"
          Copy-Item -LiteralPath 'Docs/img/logo128.png' -Destination "bin/publish/rhino/$rh/logo.png"
          Copy-Item -LiteralPath 'LICENSE' -Destination "bin/publish/rhino/$rh/LICENSE"
        }

    - name: Read version
      id: version
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = (Get-Content -LiteralPath 'Caddis.Rhino/bin/ChangelogVersion.txt' -Raw).Trim()
        if ($version -notmatch '^\d+\.\d+\.\d+$') {
          throw "Expected a stable semantic version from CHANGELOG.md, found '$version'."
        }
        "version=$version" >> $env:GITHUB_OUTPUT
        foreach ($rhp in 'rh8/net8.0/Caddis.Rhino.rhp', 'rh8/net48/Caddis.Rhino.rhp', 'rh9/net10.0/Caddis.Rhino.rhp') {
          if (-not (Test-Path -LiteralPath "bin/publish/rhino/$rhp")) {
            throw "bin/publish/rhino/$rhp is missing."
          }
        }
        Write-Host "Published Caddis $version for Rhino to bin/publish/rhino"
