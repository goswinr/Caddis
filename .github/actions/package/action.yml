name: Package
description: Publish Caddis for every Rhino runtime and build the Rhino 8 and Rhino 9 Yak packages without pushing them.

# Used by build.yml and release.yml. Requires a checkout and the .NET 10 SDK, on Windows for net48.
# Two distributions of the same version are built into bin/Release:
#   caddis-x.y.z-rh8_19-any.yak  from bin/Release/rh8: manifest.yml, logo.png, LICENSE, net8.0/ and net48/
#   caddis-x.y.z-rh9_0-any.yak   from bin/Release/rh9: manifest.yml, logo.png, LICENSE, net10.0/
# The package manager matches the major version of the distribution tag, so Rhino 8 only gets rh8 and Rhino 9 only gets rh9.
# Within a package Rhino chooses the folder of the runtime it runs on: in Rhino 8 net8.0 on Windows and Mac, net48 on Windows with .NET Framework.
# https://developer.rhino3d.com/guides/yak/creating-a-multi-targeted-rhino-plugin-package/
# https://developer.rhino3d.com/guides/yak/the-anatomy-of-a-package/#distributions

outputs:
  version:
    description: Version of the latest release in CHANGELOG.md
    value: ${{ steps.pack.outputs.version }}
  rh8-package-path:
    description: Path to the .yak file for Rhino 8, relative to the repository root
    value: ${{ steps.pack.outputs.rh8-package-path }}
  rh9-package-path:
    description: Path to the .yak file for Rhino 9, relative to the repository root
    value: ${{ steps.pack.outputs.rh9-package-path }}

runs:
  using: composite
  steps:
    # One step per framework, so that a failure in one is not masked by another.
    # Rhino provides the runtime. Publish includes Caddis.Core and the F# dependencies.
    - name: Publish net8.0
      shell: pwsh
      run: >-
        dotnet publish Caddis.Rhino/Caddis.Rhino.fsproj
        --configuration Release --framework net8.0 --self-contained false
        --output bin/Release/rh8/net8.0

    - name: Publish net48
      # Rhino 8 on .NET Framework, without the Avalonia panel.
      shell: pwsh
      run: >-
        dotnet publish Caddis.Rhino/Caddis.Rhino.fsproj
        --configuration Release --framework net48
        --output bin/Release/rh8/net48

    - name: Publish net10.0
      # Rhino 9
      shell: pwsh
      run: >-
        dotnet publish Caddis.Rhino/Caddis.Rhino.fsproj
        --configuration Release --framework net10.0 --self-contained false
        --output bin/Release/rh9/net10.0

    - name: Copy package metadata
      # Each package folder gets its own manifest.yml outside of the framework folders.
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($rh in 'rh8', 'rh9') {
          Copy-Item -LiteralPath 'Caddis.Rhino/yak.yml' -Destination "bin/Release/$rh/manifest.yml"
          Copy-Item -LiteralPath 'Docs/img/logo128.png' -Destination "bin/Release/$rh/logo.png"
          Copy-Item -LiteralPath 'LICENSE' -Destination "bin/Release/$rh/LICENSE"
        }

    - name: Download Yak
      # Use the same version and hash as Fesh.Rhino. Update both values together.
      # https://developer.rhino3d.com/guides/yak/yak-cli-reference/#downloads
      shell: pwsh
      env:
        YAK_VERSION: '0.19.1'
        YAK_SHA256: '656221A1E887A702191B9811A477517D02B5F663BE2CC6528F5E0C815DA37D12'
      run: |
        $ErrorActionPreference = 'Stop'
        Invoke-WebRequest `
          -Uri "https://files.mcneel.com/yak/tools/$env:YAK_VERSION/win-x64/yak.exe" `
          -OutFile 'bin/yak.exe'

        $hash = (Get-FileHash -LiteralPath 'bin/yak.exe' -Algorithm SHA256).Hash
        if ($hash -ne $env:YAK_SHA256) {
          throw "Downloaded yak.exe $env:YAK_VERSION has an unexpected SHA256 hash: $hash"
        }

    - name: Build Yak
      id: pack
      shell: pwsh
      working-directory: bin/Release
      run: |
        $ErrorActionPreference = 'Stop'
        $version = (Get-Content -LiteralPath '../../Caddis.Rhino/bin/ChangelogVersion.txt' -Raw).Trim()
        if ($version -notmatch '^\d+\.\d+\.\d+$') {
          throw "Expected a stable semantic version from CHANGELOG.md, found '$version'."
        }
        "version=$version" >> $env:GITHUB_OUTPUT

        # yak infers the distribution tag from the RhinoCommon the plugin references.
        # rh8_19: RhinoCommon 8.19, also for net48, it is built against RhinoCommon 8, not Rhino 7.
        # rh9_0: RhinoCommon 9.0 Beta.
        $tags = [ordered]@{ rh8 = 'rh8_19'; rh9 = 'rh9_0' }
        foreach ($rh in $tags.Keys) {
          Push-Location $rh
          ../../yak.exe build --platform any --version $version
          if ($LASTEXITCODE -ne 0) {
            throw "yak build for $rh failed with exit code $LASTEXITCODE"
          }

          $yakFiles = @(Get-ChildItem -LiteralPath . -Filter '*.yak' -File)
          $expectedName = "caddis-$version-$($tags[$rh])-any.yak"
          if ($yakFiles.Count -ne 1 -or $yakFiles[0].Name -cne $expectedName) {
            throw "Expected exactly one package named $expectedName in $rh, found: $($yakFiles.Name -join ', ')"
          }

          Move-Item -LiteralPath $yakFiles[0].FullName -Destination "../$expectedName" -Force
          Pop-Location
          "$rh-package-path=bin/Release/$expectedName" >> $env:GITHUB_OUTPUT
          Write-Host "Built $expectedName"
        }
