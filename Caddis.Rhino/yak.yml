name: Caddis
version: 0.0.0 # Overridden with the CHANGELOG.md version by yak build.
url: "https://github.com/goswinr/Caddis"
icon: logo.png
authors:
  - Goswin Rothenthal
description: >
  Caddis hosts a persistent F# Interactive session inside Rhino, controlled
  through HTTP and MCP for AI agents, remote script execution and automation.
  For Rhino 8.19 or later on .NET 8 and Rhino 9 Beta, on Windows or Mac.
  Rhino 8 on Windows can also run it on .NET Framework, without the panel.
keywords:
  - rhinoscripting
  - fsharp
  - mcp
  - automation

